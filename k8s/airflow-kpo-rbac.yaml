apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-kpo
  namespace: airflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-kpo-role
  namespace: airflow
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-kpo-rb
  namespace: airflow
subjects:
  - kind: ServiceAccount
    name: airflow-kpo
    namespace: airflow
roleRef:
  kind: Role
  name: airflow-kpo-role
  apiGroup: rbac.authorization.k8s.io
